<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本转列表工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 14px; resize: vertical; }
        select, input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        select { width: 200px; }
        .btn { padding: 8px 20px; border-radius: 4px; cursor: pointer; border: none; font-size: 14px; margin-right: 8px; }
        .btn-blue { background: #007bff; color: #fff; }
        .btn-green { background: #28a745; color: #fff; }
        .btn-gray { background: #6c757d; color: #fff; }
        .output { background: #f5f5f5; padding: 16px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 14px; min-height: 200px; }
        .preview-list { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 16px; }
        .preview-list li { margin-left: 20px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>文本转列表工具</h1>
        <div class="card">
            <div class="form-group">
                <label>输入文本（用分隔符分隔）</label>
                <textarea id="input" placeholder="例如：苹果,香蕉,橙子
或：一二三四五"></textarea>
            </div>
            <div class="form-group">
                <label>分隔符</label>
                <select id="delimiter" onchange="updateCustom()">
                    <option value=",">逗号 (,)</option>
                    <option value="\n">换行符</option>
                    <option value=" ">空格</option>
                    <option value=";">分号 (;)</option>
                    <option value="|">竖线 (|)</option>
                    <option value="custom">自定义</option>
                </select>
            </div>
            <div class="form-group" id="customGroup" style="display:none;">
                <label>自定义分隔符</label>
                <input type="text" id="customDelimiter" placeholder="输入自定义分隔符">
            </div>
            <button class="btn btn-blue" onclick="convert()">转换为列表</button>
            <button class="btn btn-gray" onclick="clearAll()">清空</button>
        </div>
        <div class="card">
            <label>输出格式</label>
            <div class="output" id="output"></div>
            <div style="margin-top: 16px;">
                <button class="btn btn-green" onclick="copyOutput()">复制结果</button>
            </div>
        </div>
        <div class="card">
            <label>预览</label>
            <div class="preview-list">
                <ol id="preview"></ol>
            </div>
        </div>
    </div>
    <script>
        function updateCustom() {
            const select = document.getElementById('delimiter');
            document.getElementById('customGroup').style.display = 
                select.value === 'custom' ? 'block' : 'none';
        }
        
        function getDelimiter() {
            const select = document.getElementById('delimiter').value;
            if (select === 'custom') {
                return document.getElementById('customDelimiter').value || ',';
            }
            return select;
        }
        
        function convert() {
            const input = document.getElementById('input').value;
            const delimiter = getDelimiter();
            const output = document.getElementById('output');
            const preview = document.getElementById('preview');
            
            if (!input.trim()) {
                output.textContent = '请输入文本';
                return;
            }
            
            let items;
            if (delimiter === '\n') {
                items = input.split('\n').filter(item => item.trim());
            } else {
                items = input.split(delimiter).map(item => item.trim()).filter(item => item);
            }
            
            if (items.length === 0) {
                output.textContent = '未能解析出任何项';
                return;
            }
            
            // Generate numbered list
            let numberedOutput = '';
            items.forEach((item, index) => {
                numberedOutput += `${index + 1}. ${item}\n`;
            });
            
            // Generate bullet list
            let bulletOutput = '';
            items.forEach(item => {
                bulletOutput += `• ${item}\n`;
            });
            
            output.textContent = `【带序号】\n${numberedOutput}\n【带圆点】\n${bulletOutput}`;
            
            // Update preview
            preview.innerHTML = items.map(item => `<li>${item}</li>`).join('');
        }
        
        function copyOutput() {
            const output = document.getElementById('output').textContent;
            if (!output || output === '请输入文本') return;
            navigator.clipboard.writeText(output).then(() => {
                alert('已复制!');
            });
        }
        
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = '';
            document.getElementById('preview').innerHTML = '';
        }
    </script>
</body>
</html>
